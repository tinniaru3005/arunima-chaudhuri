<title>Arunima Chaudhuri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Figtree:ital,wght@0,400;0,500;0,600;1,400&family=Caveat:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a scrapbook-ish single column — tilted polaroid hero, a stacked work timeline, sticker-card hobbies. Berry accent + sunshine highlight on blush paper. */
:root{
  --paper:#FBEDEA;
  --card:#FFFAF8;
  --ink:#2A1622;
  --muted:#76586A;
  --line:#EBD3D2;
  --berry:#B3134F;
  --berry-soft:#F7D3DE;
  --sun:#FFD25E;
  --sea:#2E8C8A;
  --shadow:0 1px 0 rgba(90,30,60,.06),0 10px 30px -14px rgba(90,30,60,.28);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-hand:"Caveat","Comic Sans MS","Bradley Hand",cursive;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1D1218;--card:#2A1A23;--ink:#F7E7EC;--muted:#C2A3B3;--line:#41293A;
  --berry:#FF6F9C;--berry-soft:#4A2134;--sun:#F2C14E;--sea:#5CC6C2;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1D1218;--card:#2A1A23;--ink:#F7E7EC;--muted:#C2A3B3;--line:#41293A;
  --berry:#FF6F9C;--berry-soft:#4A2134;--sun:#F2C14E;--sea:#5CC6C2;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.7);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;
  background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px;}
.wrap{max-width:1040px;margin:0 auto;padding-inline:20px;padding-block:28px 64px;display:flex;flex-direction:column;gap:88px}
a{color:var(--berry);text-decoration-thickness:1.5px;text-underline-offset:3px}
a:hover{text-decoration-color:var(--sun)}
a:focus-visible,button:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.08}
p{margin:0}
.hand{font-family:var(--f-hand);font-weight:700}
.mono{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.02em}

/* nav */
nav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--f-hand);font-size:1.9rem;font-weight:700;color:var(--ink);text-decoration:none;line-height:1}
.logo span{color:var(--berry)}
nav ul{list-style:none;display:flex;gap:6px 18px;flex-wrap:wrap;margin:0;padding:0;font-weight:500;font-size:.95rem}
nav ul a{color:var(--ink);text-decoration:none}
nav ul a:hover{color:var(--berry)}

/* hero */
.hero{display:grid;grid-template-columns:1.25fr .9fr;gap:48px;align-items:center}
.hero-text{display:flex;flex-direction:column;gap:22px;min-width:0}
.hello{font-family:var(--f-hand);font-size:1.9rem;color:var(--berry);line-height:1}
.hero h1{font-size:clamp(2.6rem,6.4vw,4.6rem);font-weight:800;letter-spacing:-.025em}
.hero h1 .hl{background:linear-gradient(transparent 58%,var(--sun) 58%,var(--sun) 90%,transparent 90%);padding-inline:.06em}
.lede{font-size:1.18rem;max-width:34em;color:var(--ink)}
.lede em{font-style:normal;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);text-decoration:none;font-weight:600;font-size:.9rem;transition:transform .15s,background .15s}
.chip:hover{background:var(--sun);color:#2A1622;transform:translateY(-2px) rotate(-1deg)}
.email-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:.95rem}
.email-row code{font-family:var(--f-mono);font-size:.88rem;color:var(--ink);user-select:all;word-break:break-all}
.copy{font:600 .82rem var(--f-body);border:0;border-radius:999px;padding:6px 12px;background:var(--berry-soft);color:var(--ink);cursor:pointer}
.copy:hover{background:var(--sun);color:#2A1622}

.polaroid-wrap{position:relative;justify-self:center;max-width:380px;width:100%}
.polaroid{background:#FFFDFB;padding:14px 14px 58px;box-shadow:var(--shadow);transform:rotate(3deg);transition:transform .4s cubic-bezier(.3,1.6,.5,1);position:relative}
.polaroid:hover{transform:rotate(-1deg) scale(1.02)}
.polaroid img{display:block;width:100%;aspect-ratio:662/720;object-fit:cover;max-width:100%}
.polaroid figcaption{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-family:var(--f-hand);font-size:1.55rem;color:#3A2230;font-weight:700}
.tape{position:absolute;top:-14px;left:50%;width:110px;height:30px;transform:translateX(-50%) rotate(-4deg);background:color-mix(in srgb,var(--sun) 70%,transparent);z-index:2}
.note{position:absolute;left:-22px;top:36px;background:var(--berry);color:#fff;font-family:var(--f-hand);font-size:1.3rem;padding:8px 14px;border-radius:4px;transform:rotate(-6deg);box-shadow:var(--shadow);z-index:3;line-height:1.1;max-width:200px}

/* section heads */
.sec{display:flex;flex-direction:column;gap:28px}
.sec-head{display:flex;flex-direction:column;gap:6px}
.sec-head .kicker{font-family:var(--f-hand);font-size:1.5rem;color:var(--berry);line-height:1}
.sec-head h2{font-size:clamp(2rem,4.4vw,3rem);font-weight:800;letter-spacing:-.02em}
.sec-head p{color:var(--muted);max-width:40em}

/* now / invaris */
.now{background:var(--ink);color:var(--paper);border-radius:22px;padding:clamp(24px,4vw,44px);display:grid;grid-template-columns:1fr 1fr;gap:32px;position:relative;overflow:hidden}
.now::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:var(--berry);opacity:.35}
.now > *{position:relative;z-index:1;min-width:0}
.now .badge{display:inline-block;background:var(--sun);color:#2A1622;font-weight:700;font-size:.8rem;padding:4px 10px;border-radius:999px;letter-spacing:.04em;text-transform:uppercase}
.now h3{font-size:clamp(1.7rem,3.4vw,2.4rem);font-weight:800;margin-top:14px}
.now p{color:color-mix(in srgb,var(--paper) 82%,transparent)}
.now a{color:var(--sun)}
.now .intro{display:flex;flex-direction:column;gap:12px}
.proj{display:flex;flex-direction:column;gap:14px}
.proj a.p{display:block;text-decoration:none;color:inherit;border:1.5px solid color-mix(in srgb,var(--paper) 25%,transparent);border-radius:14px;padding:16px 18px;transition:border-color .2s,transform .2s}
.proj a.p:hover{border-color:var(--sun);transform:translateX(4px)}
.proj strong{font-family:var(--f-display);font-size:1.25rem;color:var(--sun);display:block}
.proj span{font-size:.95rem;color:color-mix(in srgb,var(--paper) 80%,transparent)}

/* timeline */
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:18px;position:relative}
.timeline::before{content:"";position:absolute;left:9px;top:8px;bottom:8px;width:2px;background:repeating-linear-gradient(var(--line) 0 6px,transparent 6px 12px)}
.job{display:grid;grid-template-columns:20px 1fr;gap:18px}
.dot{width:20px;height:20px;border-radius:50%;background:var(--card);border:3px solid var(--berry);margin-top:20px;position:relative;z-index:1}
.job-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:10px;min-width:0}
.job-top{display:flex;justify-content:space-between;gap:6px 16px;flex-wrap:wrap;align-items:baseline}
.job-top h3{font-size:1.25rem;font-weight:700}
.job-top .org{color:var(--berry);font-weight:600}
.when{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);white-space:nowrap}
.job-card ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.job-card li::marker{color:var(--berry)}
.job-card .plain{color:var(--muted);font-size:.98rem}

/* research + builds */
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--ink);transition:transform .2s,box-shadow .2s;min-width:0}
a.tile:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:var(--shadow)}
.tile h3{font-size:1.18rem;font-weight:700;line-height:1.25}
.tile p{color:var(--muted);font-size:.96rem}
.tile .meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-top:auto;padding-top:6px}
.tag{font-family:var(--f-mono);font-size:.72rem;padding:3px 8px;border-radius:6px;background:var(--berry-soft);color:var(--ink)}
.go{font-weight:600;color:var(--berry);font-size:.9rem}

/* community */
.awards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.award{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.award span a{color:var(--berry)}
.tile .job-top h3{font-size:1.12rem}
.tile p.links{color:var(--ink);font-size:.92rem}
.talks{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:0 32px;border-top:1.5px solid var(--ink)}
.talks li{display:flex;flex-direction:column;gap:2px;padding:14px 0;border-bottom:1px dashed var(--line);min-width:0}
.talks li a,.talks li b{font-family:var(--f-display);font-weight:600;font-size:1.08rem;line-height:1.3}
.talks li span{color:var(--muted);font-size:.9rem}
.award .star{flex:none;width:30px;height:30px}
.award b{display:block;font-weight:600}
.award span{color:var(--muted);font-size:.92rem}

/* off the clock */
.fun{background:var(--berry-soft);border-radius:28px;padding:clamp(24px,4vw,48px);display:flex;flex-direction:column;gap:30px}
.stickers{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.sticker{background:var(--card);border-radius:18px;padding:18px 16px 20px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;box-shadow:var(--shadow);transition:transform .3s cubic-bezier(.3,1.6,.5,1);min-width:0}
.sticker:nth-child(odd){transform:rotate(-2deg)}
.sticker:nth-child(even){transform:rotate(1.8deg)}
.sticker:hover{transform:rotate(0) translateY(-6px) scale(1.03)}
.sticker svg{width:54px;height:54px}
.sticker h3{font-family:var(--f-hand);font-size:1.7rem;font-weight:700;line-height:1}
.sticker p{font-size:.92rem;color:var(--muted)}

/* footer */
footer{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:12px}
footer h2{font-size:clamp(2rem,5vw,3.2rem);font-weight:800}
footer p{color:var(--muted);max-width:32em}
.cat-btn{background:none;border:0;cursor:pointer;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink)}
.cat-btn svg{width:96px;height:80px}
.cat-btn .tail{transform-origin:66px 62px;animation:wag 2.4s ease-in-out infinite}
.cat-btn:hover .ear{transform:translateY(-2px)}
.ear{transition:transform .2s}
.mrrp{font-family:var(--f-hand);font-size:1.3rem;color:var(--berry);min-height:1.6em}
@keyframes wag{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg)}}
.small{font-size:.85rem;color:var(--muted)}

@media (max-width:860px){
  .hero{grid-template-columns:1fr;gap:56px}
  .polaroid-wrap{max-width:320px}
  .now{grid-template-columns:1fr}
  .grid3{grid-template-columns:1fr 1fr}
  .stickers{grid-template-columns:repeat(2,1fr)}
  .awards{grid-template-columns:1fr 1fr}
}
@media (max-width:560px){
  body{font-size:16px}
  .wrap{gap:68px}
  .grid2,.grid3,.awards,.talks{grid-template-columns:1fr}
  .note{left:-6px}
  .sticker:last-child{grid-column:1 / -1}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
